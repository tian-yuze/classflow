<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="课序 ClassFlow —— 一款好看、好用的本地课程表：支持教务系统导入、多表叠加、课程冲突与进度管理。">
  <title>课序 ClassFlow · 课程表</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.7A8.6 8.6 0 0 1 9.3 3.5a8.7 8.7 0 1 0 11.2 11.2Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11M8 10.5l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6.5 7l.8 13h9.4l.8-13M9.5 7V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19.2 8.8a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="M13.8 6.2l4 4"/></symbol>

    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z"/><path d="M9.8 19.5a2.4 2.4 0 0 0 4.4 0"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9L14 21.5H5A1.5 1.5 0 0 1 3.5 20V6A1.5 1.5 0 0 1 5 4.5Z"/><path d="M14 21.5V15h6.5M7.5 9h9M7.5 13h5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z"/><path d="M2.5 12.5 12 17.5l9.5-5M2.5 17 12 22l9.5-5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>

    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <div class="page">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#" data-action="today" aria-label="课序 ClassFlow，回到本周">
          <span class="brand-mark" aria-hidden="true">课</span>
          <span class="brand-text">
            <span class="brand-name">课序</span>
            <span class="brand-sub">ClassFlow</span>
          </span>
        </a>

        <div class="schedule-tabs" id="schedule-tabs" role="tablist" aria-label="课程表切换"></div>

        <div class="topbar-actions">
          <button class="btn btn-ghost hide-sm" type="button" data-action="open-import">
            <svg class="icon"><use href="#i-import"></use></svg><span>导入课表</span>
          </button>
          <button class="btn btn-ghost icon-only-sm" type="button" data-action="open-import" aria-label="导入课表" title="导入课表">
            <svg class="icon"><use href="#i-import"></use></svg>
          </button>
          <button class="btn btn-ghost task-entry" type="button" data-action="open-tasks" aria-label="任务与备忘" title="任务与备忘">
            <svg class="icon"><use href="#i-check-square"></use></svg><span class="hide-xs">任务</span>
            <b class="task-count-badge" id="task-count-badge" hidden></b>
          </button>
          <button class="btn btn-primary" type="button" data-action="new-course">
            <svg class="icon"><use href="#i-plus"></use></svg><span class="hide-xs">添加课程</span>
          </button>
          <button class="icon-btn" type="button" data-action="toggle-theme" id="theme-btn" aria-label="切换明暗主题" title="切换明暗主题">
            <svg class="icon"><use href="#i-moon"></use></svg>
          </button>
          <button class="icon-btn" type="button" data-action="open-settings" aria-label="设置" title="设置">
            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="page-main">
      <div id="tip-slot"></div>
      <div class="app-main">
        <section class="content" aria-label="课程表">
          <div class="weekbar" id="weekbar"></div>
          <div id="view-root" class="view-root"></div>
        </section>
        <aside class="rail" id="rail" aria-label="课程概览"></aside>
      </div>
    </div>

    <footer class="page-foot">
      <span class="foot-brand">课序 <em>ClassFlow</em></span>
      <span>数据仅保存在本机浏览器 · 不上传任何服务器</span>
    </footer>
  </div>

  <div id="week-menu" class="week-menu" hidden></div>
  <div id="modal-root"></div>
  <div id="confirm-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">课序需要 JavaScript 才能运行，请在浏览器设置中启用 JavaScript 后刷新页面。</div>
  </noscript>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/parse.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
